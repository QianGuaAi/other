<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕海岸骑行</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#173d43;background:#f4f7ef}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px}main{width:min(1040px,100%)}h1{margin:0 0 12px;font-size:clamp(24px,3vw,36px)}.stage{overflow:hidden;border:1px solid #bfd5cf;border-radius:8px;box-shadow:0 18px 44px #214d5024}svg{display:block;width:100%;height:auto}.tools{display:flex;justify-content:space-between;gap:16px;padding-top:12px;color:#5d7b80;font-size:13px}.tools div{display:flex;gap:10px;align-items:center}button{padding:8px 13px;border:1px solid #aac7c1;border-radius:5px;background:#fffdf5;color:#173d43;font:inherit;cursor:pointer}input{width:130px;accent-color:#117d79}@media(max-width:560px){.tools{flex-direction:column;align-items:start}}
</style>
</head>
<body><main>
<h1>鹈鹕海岸骑行</h1>
<div class="stage"><svg id="scene" viewBox="0 0 1000 560" role="img" aria-label="鹈鹕骑自行车的二维 SVG 动画">
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#a8dfe6"/><stop offset="1" stop-color="#f3dfb8"/></linearGradient><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#55b2ae"/><stop offset="1" stop-color="#277b82"/></linearGradient><linearGradient id="sand" x2="0" y2="1"><stop stop-color="#d8c8aa"/><stop offset="1" stop-color="#efe1c5"/></linearGradient><linearGradient id="pouch" x2="0" y2="1"><stop stop-color="#f2a065"/><stop offset="1" stop-color="#d45e4d"/></linearGradient>
<g id="spokes" stroke="#8da8a4" stroke-width="1.3"><path d="M-55 0h110M0-55V55M-39-39L39 39M-39 39L39-39M-21-51L21 51M21-51L-21 51M-51-21L51 21M-51 21L51-21"/></g><g id="cloud"><ellipse rx="44" ry="11"/><ellipse cx="24" cy="-10" rx="24" ry="17"/><ellipse cx="52" cy="1" rx="33" ry="10"/></g>
</defs>
<rect width="1000" height="560" fill="url(#sky)"/><circle cx="130" cy="105" r="48" fill="#f8c85f"/><circle cx="130" cy="105" r="72" fill="#f8c85f" opacity=".16"/><g id="clouds" fill="#fffdf5"><use href="#cloud" transform="translate(280 90)"/><use href="#cloud" transform="translate(720 140)"/><use href="#cloud" transform="translate(1280 90)"/></g>
<path d="M0 275q160-28 320 0t320-4t360 6v92H0z" fill="#8cb7aa"/><path d="M0 310q160-27 320 0t320-4t360 0v100H0z" fill="url(#sea)"/><g id="waves" fill="none" stroke="#c8eee5" stroke-width="2"><path d="M-30 330q24-8 48 0t48 0t48 0t48 0t48 0t48 0t48 0t48 0t48 0t48 0t48 0t48 0t48 0t48 0t48 0t48 0t48 0t48 0t48 0"/><path d="M-30 358q20-7 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0"/></g>
<path d="M0 395q170-21 340 0t330-4t330 4v165H0z" fill="#b3c89d"/><path d="M0 430q180-20 360 0t330-4t310 6v128H0z" fill="url(#sand)"/><path d="M0 470q180-15 360 0t330-3t310 3" fill="none" stroke="#fff9eb" stroke-width="4"/><path id="lane" d="M-30 512h70m50 0h70m50 0h70m50 0h70m50 0h70m50 0h70m50 0h70m50 0h70" stroke="#fff9eb" stroke-width="4" stroke-linecap="round"/>
<g id="rear" transform="translate(330 420)"><circle r="61" fill="#fffdf5" stroke="#29494d" stroke-width="9"/><circle r="53" fill="none" stroke="#9bb0aa" stroke-width="2"/><use id="rear-spokes" href="#spokes"/><circle r="6" fill="#df704d"/></g><g id="front" transform="translate(670 420)"><circle r="61" fill="#fffdf5" stroke="#29494d" stroke-width="9"/><circle r="53" fill="none" stroke="#9bb0aa" stroke-width="2"/><use id="front-spokes" href="#spokes"/><circle r="6" fill="#df704d"/></g>
<g fill="none" stroke="#137f79" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M330 420l105-82 55 82H330M435 338h165l-110 82M600 338l70 82M587 338l13-34"/><path d="M579 304h51" stroke="#d9654d" stroke-width="10"/><path d="M435 338l-6-22" stroke="#526b67" stroke-width="6"/><path d="M403 315q26-9 53 0" stroke="#d9654d" stroke-width="10"/></g>
<g id="far-pedal"><line x2="27" stroke="#53615c" stroke-width="6"/><rect x="23" y="-4" width="28" height="8" rx="3" fill="#344746"/></g><g id="near-pedal"><circle r="12" fill="#4a5c58"/><circle r="4" fill="#f4c65b"/><line x2="27" stroke="#df704d" stroke-width="7"/><rect x="22" y="-4" width="31" height="9" rx="3" fill="#344746"/></g>
<g fill="none" stroke="#c98252" stroke-linecap="round"><line id="far-thigh" stroke-width="9"/><line id="far-shin" stroke-width="7"/><circle id="far-knee" r="5" fill="#d8945d" stroke="none"/></g><g fill="none" stroke="#e5935c" stroke-linecap="round"><line id="near-thigh" stroke-width="11"/><line id="near-shin" stroke-width="8"/><circle id="near-knee" r="6" fill="#efa66c" stroke="none"/></g>
<g id="pelican"><path d="M418 275q-32-8-47-25 23 7 43 10m-40 5q21 4 39 15" fill="none" stroke="#fffdf7" stroke-width="9" stroke-linecap="round"/><path d="M418 273q-12-35 5-65 13-22 44-19 38 3 49 37 9 29-12 52-29 27-72 9z" fill="#fffdf7" stroke="#c8d9d3" stroke-width="2"/><path d="M440 239q25-21 58-7 17 8 19 24-26-12-44-4-20 9-33 0z" fill="#e4eee8"/><ellipse cx="499" cy="179" rx="31" ry="28" fill="#fffdf7" stroke="#c8d9d3" stroke-width="2"/><path d="M474 165q4-29 29-29 24 0 30 24-29-13-59 5" fill="#137f79"/><path d="M475 161q26-22 55-1" fill="none" stroke="#f4c65b" stroke-width="5"/><circle cx="510" cy="178" r="4" fill="#173b43"/><path d="M520 179q53-8 116 5l9 8q-51 10-123 6z" fill="#f5ca5d" stroke="#bd8938" stroke-width="2"/><path d="M520 193q53 6 110-1-11 36-51 40-40 4-60-22-5-7 1-17z" fill="url(#pouch)" stroke="#d35e4d" stroke-width="2"/><path id="wing" d="M494 246q50 6 93 43-19 19-57 2-27-12-43-29z" fill="#edf5ef" stroke="#c8d9d3" stroke-width="2"/><path d="M563 278q13 10 21 22" fill="none" stroke="#fffdf7" stroke-width="9" stroke-linecap="round"/><circle cx="585" cy="302" r="5.5" fill="#df704d"/></g>
</svg></div><div class="tools"><div><button id="play">暂停动画</button><span id="status">沿海岸骑行</span></div><div><label for="speed">速度</label><input id="speed" type="range" min=".5" max="1.8" step=".1" value="1"></div></div>
</main>
<script>
const $=id=>document.getElementById(id),play=$("play"),status=$("status"),speed=$("speed"),rear=$("rear-spokes"),front=$("front-spokes"),lane=$("lane"),clouds=$("clouds"),waves=$("waves"),wing=$("wing"),crank={x:490,y:420,r:27},legs=[{k:"far",h:{x:452,y:278},u:55,l:58,p:Math.PI},{k:"near",h:{x:458,y:273},u:56,l:60,p:0}];let a=.6,d=0,last=performance.now(),playing=!matchMedia("(prefers-reduced-motion: reduce)").matches;
function knee(h,f,u,l){let x=f.x-h.x,y=f.y-h.y,n=Math.hypot(x,y)||1,L=Math.max(Math.abs(u-l)+1,Math.min(u+l-1,n));x*=L/n;y*=L/n;let t=Math.atan2(y,x),q=Math.acos(Math.max(-1,Math.min(1,(u*u+L*L-l*l)/(2*u*L))));return{x:h.x+Math.cos(t-q)*u,y:h.y+Math.sin(t-q)*u}}
function line(id,a,b){let e=$(id);e.setAttribute("x1",a.x);e.setAttribute("y1",a.y);e.setAttribute("x2",b.x);e.setAttribute("y2",b.y)}
function draw(){let deg=a*180/Math.PI,bob=Math.sin(a*2)*2.5;rear.setAttribute("transform",`rotate(${-deg})`);front.setAttribute("transform",`rotate(${-deg})`);$("near-pedal").setAttribute("transform",`translate(${crank.x} ${crank.y}) rotate(${deg})`);$("far-pedal").setAttribute("transform",`translate(${crank.x} ${crank.y}) rotate(${deg+180})`);lane.setAttribute("transform",`translate(${-d%180} 0)`);clouds.setAttribute("transform",`translate(${-d*.06%1000} 0)`);waves.setAttribute("transform",`translate(${-d*.15%54} 0)`);$("pelican").setAttribute("transform",`translate(0 ${bob})`);wing.setAttribute("transform",`rotate(${Math.sin(a*2)*5} 520 260)`);for(const z of legs){let t=a+z.p,f={x:crank.x+Math.cos(t)*crank.r,y:crank.y+Math.sin(t)*crank.r},h={x:z.h.x,y:z.h.y+bob},k=knee(h,f,z.u,z.l);line(z.k+"-thigh",h,k);line(z.k+"-shin",k,f);$(z.k+"-knee").setAttribute("cx",k.x);$(z.k+"-knee").setAttribute("cy",k.y)}}
function tick(now){let dt=Math.min(.04,(now-last)/1000);last=now;if(playing){let p=Number(speed.value);a+=dt*p*2.8;d+=dt*p*175;draw()}requestAnimationFrame(tick)}play.onclick=()=>{playing=!playing;play.textContent=playing?"暂停动画":"继续动画";status.textContent=playing?"沿海岸骑行":"停在海风里";last=performance.now()};draw();requestAnimationFrame(tick);
</script></body></html>
