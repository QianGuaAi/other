      padding: 28px 22px;

    .cap {

    svg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.38);
    }

    #lid {
      transform-box: fill-box;
      transform-origin: center;
      transform: scaleY(0);
      animation: blink 5.4s infinite;
    }

    @keyframes blink {
      0%, 88%, 100% { transform: scaleY(0); }
      92%, 96% { transform: scaleY(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      #lid { animation: none; }
    }

    const ns = "http://www.w3.org/2000/svg";

    const shinN = document.getElementById("shin-near");
    const kneeN = document.getElementById("knee-near");
    const thighF = document.getElementById("thigh-far");
    const shinF = document.getElementById("shin-far");
    const kneeF = document.getElementById("knee-far");

    const grassTile = document.createElementNS(ns, "g");
    for (let x = 40; x < 1280; x += 74) {
      const u = document.createElementNS(ns, "use");
      u.setAttribute("href", "#tuft");
      u.setAttribute("transform", `translate(${x + (x % 23)}, ${692 + (x % 11)})`);
      grassTile.appendChild(u);
    }
    const grassB = grassTile.cloneNode(true);
    grassB.setAttribute("transform", "translate(1280,0)");
    grass.appendChild(grassTile);
    grass.appendChild(grassB);

    function externalTangents(c1, r1, c2, r2) {
      const dx = c2.x - c1.x;
      const dy = c2.y - c1.y;
      const dist = Math.hypot(dx, dy);
      const vx = dx / dist;
      const vy = dy / dist;
      const c = (r1 - r2) / dist;
      const h = Math.sqrt(Math.max(0, 1 - c * c));
      return [1, -1].map((sign) => {
        const nx = vx * c - sign * h * vy;
        const ny = vy * c + sign * h * vx;
        return {
          x1: c1.x + r1 * nx,
          y1: c1.y + r1 * ny,
          x2: c2.x + r2 * nx,
          y2: c2.y + r2 * ny,
        };
      });
    }

    const tangents = externalTangents({ x: 0, y: -64 }, 11, BB, 20);
    chain.setAttribute("d", tangents.map((t) => `M ${t.x1} ${t.y1} L ${t.x2} ${t.y2}`).join(" "));

    function solveKnee(hip, foot, l1, l2, bend) {
      let dx = foot.x - hip.x;
      let dy = foot.y - hip.y;
      let dist = Math.hypot(dx, dy) || 0.001;
      const max = l1 + l2 - 0.6;
      const min = Math.abs(l1 - l2) + 0.6;
      const clamped = Math.min(max, Math.max(min, dist));
      dx *= clamped / dist;
      dy *= clamped / dist;
      dist = clamped;
      const angle = Math.atan2(dy, dx);
      const cosA = (l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist);
      const offset = Math.acos(Math.max(-1, Math.min(1, cosA)));
      const kneeAngle = angle + bend * offset;
      return {
        x: hip.x + Math.cos(kneeAngle) * l1,
        y: hip.y + Math.sin(kneeAngle) * l1,
      };
    }

    function placeLeg(thigh, shin, kneeDot, hip, foot, l1, l2) {
      const knee = solveKnee(hip, foot, l1, l2, -1);
      thigh.setAttribute("x1", hip.x);
      thigh.setAttribute("y1", hip.y);
      thigh.setAttribute("x2", knee.x);
      thigh.setAttribute("y2", knee.y);
      shin.setAttribute("x1", knee.x);
      shin.setAttribute("y1", knee.y);
      shin.setAttribute("x2", foot.x);
      shin.setAttribute("y2", foot.y);
      kneeDot.setAttribute("cx", knee.x);
      kneeDot.setAttribute("cy", knee.y);
    }

    function pedalPoint(angle) {
      return {
        x: BB.x + Math.cos(angle) * CRANK,
        y: BB.y + Math.sin(angle) * CRANK,
      };
    }

    function wrap(el, width, offset) {
      const x = -((offset % width) + width) % width;
      el.setAttribute("transform", `translate(${x},0)`);
    }

    let theta = 0.9;
    let dist = 0;
    let last = performance.now();

    function render() {
      const deg = (theta * 180) / Math.PI;
      const wheelDeg = deg * GEAR;
      const bob = Math.sin(theta * 2) * 4;

      rearRotor.setAttribute("transform", `rotate(${wheelDeg})`);
      frontRotor.setAttribute("transform", `rotate(${wheelDeg})`);

      crankFar.setAttribute("transform", `translate(${BB.x},${BB.y}) rotate(${deg + 180})`);
      pedalFar.setAttribute("transform", `translate(${CRANK},0) rotate(${-(deg + 180)})`);
      crankNear.setAttribute("transform", `translate(${BB.x},${BB.y}) rotate(${deg})`);
      pedalNear.setAttribute("transform", `translate(${CRANK},0) rotate(${-deg})`);

      const hipN = { x: HIP_N.x, y: HIP_N.y + bob };
      const hipF = { x: HIP_F.x, y: HIP_F.y + bob };
      placeLeg(thighN, shinN, kneeN, hipN, pedalPoint(theta), THIGH_N, SHIN_N);
      placeLeg(thighF, shinF, kneeF, hipF, pedalPoint(theta + Math.PI), THIGH_F, SHIN_F);

      rider.setAttribute("transform", `translate(0,${bob})`);
      upper.setAttribute("transform", `rotate(${Math.sin(theta) * 2.1}, 150, -330)`);
      tail.setAttribute("transform", `rotate(${Math.sin(theta * 2 + 0.4) * 5}, 0, -248)`);
      wingFar.setAttribute("transform", `rotate(${Math.sin(theta * 2) * 3}, 30, -280)`);
      fish.setAttribute("transform", `rotate(${Math.sin(theta * 3) * 8}, 344, -344)`);

      chain.style.strokeDashoffset = String(-theta * 22);
      lane.style.strokeDashoffset = String(dist);

      wrap(clouds, 1280, dist * 0.12);
      wrap(shore, 1280, dist * 0.28);
      wrap(posts, 1280, dist * 0.42);
      wrap(grass, 1280, dist * 1.05);
      waves.setAttribute("transform", `translate(${-(((dist * 0.35) % 120 + 120) % 120)},0)`);
    }

    render();

    function tick(now) {
      const dt = Math.min(0.034, (now - last) / 1000);
      last = now;
      theta += CADENCE * dt;
      dist += WHEEL_R * GEAR * CADENCE * dt;
      render();
      requestAnimationFrame(tick);
    }

    if (!reduce) requestAnimationFrame(tick);
  </script>
</body>
</html>
