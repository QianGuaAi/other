<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pelican Coast Ride</title><style>:root{font-family:Segoe UI,Arial,sans-serif;color:#173d43;background:#f4f8f3}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px}main{width:min(1080px,100%)}header{display:flex;justify-content:space-between;align-items:end;margin:0 4px 14px}h1{margin:0;font-size:clamp(24px,3vw,36px)}header p{margin:0;color:#608084}.stage{overflow:hidden;border:1px solid #c3d8d0;border-radius:8px;box-shadow:0 18px 46px #1f4d4d22}svg{display:block;width:100%;height:auto}.bar{display:flex;justify-content:space-between;padding-top:12px;color:#608084;font-size:13px}.bar div{display:flex;gap:12px;align-items:center}button{min-height:36px;padding:0 14px;border:1px solid #aecbc4;border-radius:5px;background:#fffdf6;color:#173d43;font:inherit;cursor:pointer}input{accent-color:#14867e}@media(max-width:560px){header,.bar{align-items:start;flex-direction:column}}</style></head><body><main><header><h1>Pelican Coast Ride</h1><p>SVG 2D animation</p></header><div class="stage"><svg id="scene" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">A pelican riding a bicycle by the sea</title><desc id="desc">A white pelican pedals a coral bicycle beside moving waves.</desc><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#bce8e4"/><stop offset="1" stop-color="#f4e4bb"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#64b9b2"/><stop offset="1" stop-color="#247f83"/></linearGradient><linearGradient id="road" x2="0" y2="1"><stop stop-color="#d6c39d"/><stop offset="1" stop-color="#eddebf"/></linearGradient><linearGradient id="bill" x2="0" y2="1"><stop stop-color="#ffda71"/><stop offset="1" stop-color="#df9b39"/></linearGradient><linearGradient id="pouch" x2="0" y2="1"><stop stop-color="#f2a05b"/><stop offset="1" stop-color="#d76449"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="7"/></filter><g id="spokes" stroke="#8aa7a0" stroke-width="1.3"><path d="M-58 0h116M0-58V58M-41-41L41 41M-41 41L41-41M-22-54L22 54M22-54L-22 54M-54-22L54 22M-54 22L54-22"/></g><g id="cloud"><ellipse rx="48" ry="12"/><ellipse cx="25" cy="-11" rx="26" ry="18"/><ellipse cx="56" cy="1" rx="38" ry="11"/></g></defs><rect width="1000" height="600" fill="url(#sky)"/><circle cx="145" cy="112" r="55" fill="#f6c963"/><circle cx="145" cy="112" r="78" fill="#f6c963" opacity=".14"/><g id="clouds" fill="#fffdf5" opacity=".86"><use href="#cloud" transform="translate(310 108)"/><use href="#cloud" transform="translate(760 150)"/><use href="#cloud" transform="translate(1310 108)"/><use href="#cloud" transform="translate(1760 150)"/></g><path d="M0 300Q150 280 300 302T600 300T1000 292V390H0Z" fill="#8fb9ad"/><path d="M0 330Q150 305 300 330T600 326T1000 320V430H0Z" fill="url(#water)"/><g id="waves" fill="none" stroke="#c9eee3" stroke-width="2"><path d="M-40 350q25-9 50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0"/><path d="M-40 380q22-7 44 0t44 0t44 0t44 0t44 0t44 0t44 0t44 0t44 0t44 0t44 0t44 0t44 0t44 0t44 0t44 0t44 0t44 0t44 0t44 0t44 0t44 0"/></g><path d="M0 415Q180 395 360 410T720 408T1000 415V600H0Z" fill="#b5ca9c"/><path d="M0 448Q180 425 360 443T720 440T1000 450V600H0Z" fill="url(#road)"/><path d="M0 495Q180 481 360 494T720 491T1000 499" fill="none" stroke="#fff9e8" stroke-width="4"/><path id="lane" d="M-40 535h72m52 0h72m52 0h72m52 0h72m52 0h72m52 0h72m52 0h72m52 0h72m52 0h72" fill="none" stroke="#fff9e8" stroke-width="4" stroke-linecap="round"/><ellipse cx="500" cy="472" rx="255" ry="17" fill="#4e6d61" opacity=".23" filter="url(#blur)"/>
<g id="bike"><g id="rearWheel" transform="translate(320 430)"><circle r="68" fill="#fffdf5" stroke="#29494d" stroke-width="9"/><circle r="58" fill="none" stroke="#9bb0aa" stroke-width="2"/><use id="rearSpokes" href="#spokes"/><circle r="7" fill="#df6f4b"/></g><g id="frontWheel" transform="translate(680 430)"><circle r="68" fill="#fffdf5" stroke="#29494d" stroke-width="9"/><circle r="58" fill="none" stroke="#9bb0aa" stroke-width="2"/><use id="frontSpokes" href="#spokes"/><circle r="7" fill="#df6f4b"/></g><g fill="none" stroke="#14867e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M320 430l110-90 62 90H320M430 340h174l-112 90M604 340l76 90M590 340l12-36"/><path d="M579 304h55" stroke="#d96348" stroke-width="10"/><path d="M430 340l-8-25" stroke="#536c68" stroke-width="6"/><path d="M397 313q30-10 58 0" stroke="#d96348" stroke-width="11"/></g><path d="M320 430h172l-38-17-134 17" fill="none" stroke="#435955" stroke-width="2.5" stroke-dasharray="5 4"/><g id="farPedal" transform="translate(492 430)"><line x2="30" stroke="#56645f" stroke-width="6"/><rect x="25" y="-4" width="29" height="8" rx="3" fill="#3b4d4c"/></g><g id="nearPedal" transform="translate(492 430)"><circle r="13" fill="#4d5e59"/><circle r="5" fill="#f5c860"/><line x2="30" stroke="#df6f4b" stroke-width="7"/><rect x="23" y="-4" width="35" height="9" rx="3" fill="#344746"/></g><g fill="none" stroke="#ca8452" stroke-linecap="round"><line id="farThigh" stroke-width="10"/><line id="farShin" stroke-width="8"/><circle id="farKnee" r="6" fill="#d8955d" stroke="none"/></g><g fill="none" stroke="#e6935b" stroke-linecap="round"><line id="nearThigh" stroke-width="12"/><line id="nearShin" stroke-width="9"/><circle id="nearKnee" r="7" fill="#efa66b" stroke="none"/></g></g>
<g id="pelican"><path d="M424 292q-35-10-52-29 25 8 48 12m-44 4q22 4 43 17" fill="none" stroke="#fffdf5" stroke-width="9" stroke-linecap="round"/><path d="M422 288q-13-38 6-72 14-24 48-20 41 3 53 40 10 32-13 57-31 29-78 10z" fill="#fffdf5" stroke="#c5d8d2" stroke-width="2"/><path d="M442 249q28-23 64-8 18 9 20 27-28-13-48-4-22 10-36 0z" fill="#e3eee7"/><path d="M475 226q11-29 23-42l23 5q-6 31-24 49" fill="#fffdf5" stroke="#c5d8d2" stroke-width="2"/><ellipse cx="506" cy="181" rx="34" ry="31" fill="#fffdf5" stroke="#c5d8d2" stroke-width="2"/><path d="M480 166q4-31 31-31 26 0 32 26-31-15-63 5" fill="#14867e"/><path d="M481 162q28-24 59-1" fill="none" stroke="#f5c860" stroke-width="5"/><circle cx="519" cy="180" r="4.5" fill="#173c43"/><circle cx="520.5" cy="178.5" r="1.4" fill="#fffdf5"/><path d="M530 181q58-9 125 5l10 8q-55 11-133 7z" fill="url(#bill)" stroke="#c89237" stroke-width="2"/><path d="M530 195q58 7 119-1-12 40-55 44-43 4-64-24-5-7 0-19" fill="url(#pouch)" stroke="#d96348" stroke-width="2"/><path d="M544 204q19 22 45 23" fill="none" stroke="#ffd28d" stroke-width="3"/><path d="M480 247q53-5 108 42-24 14-76 0-38-11-50-25z" fill="#fffdf5" stroke="#c5d8d2" stroke-width="2"/><path id="wing" d="M500 256q55 6 101 47-20 20-62 2-29-13-47-31z" fill="#edf5ef" stroke="#c5d8d2" stroke-width="2"/><path d="M579 291q14 11 23 25" fill="none" stroke="#fffdf5" stroke-width="10"/><circle cx="603" cy="316" r="6" fill="#e06f4c"/></g>
</svg></div><div class="bar"><div><button id="play" type="button" aria-pressed="false">Pause ride</button><span id="status" aria-live="polite">Rolling with the tide</span></div><div><label for="speed">Speed</label><input id="speed" type="range" min=".4" max="2" step=".1" value="1"></div></div></main>
<script>
const $=id=>document.getElementById(id),play=$("play"),status=$("status"),speed=$("speed"),rear=$("rearSpokes"),front=$("frontSpokes"),lane=$("lane"),clouds=$("clouds"),waves=$("waves"),wing=$("wing"),pedal={x:492,y:430,r:30},legs=[{k:"far",h:{x:455,y:291},u:57,l:62,p:Math.PI},{k:"near",h:{x:460,y:286},u:59,l:64,p:0}];
let a=.8,d=0,last=performance.now(),running=!matchMedia("(prefers-reduced-motion: reduce)").matches;
function knee(h,f,u,l){let x=f.x-h.x,y=f.y-h.y,n=Math.hypot(x,y)||1,b=Math.max(Math.abs(u-l)+1,Math.min(u+l-1,n));x*=b/n;y*=b/n;let q=Math.atan2(y,x),c=Math.acos(Math.max(-1,Math.min(1,(u*u+b*b-l*l)/(2*u*b))));return{x:h.x+Math.cos(q-c)*u,y:h.y+Math.sin(q-c)*u}}
function seg(id,s,e){let x=$(id);x.setAttribute("x1",s.x);x.setAttribute("y1",s.y);x.setAttribute("x2",e.x);x.setAttribute("y2",e.y)}
function draw(){let deg=a*180/Math.PI,bob=Math.sin(a*2)*2.4;rear.setAttribute("transform",`rotate(${-deg})`);front.setAttribute("transform",`rotate(${-deg})`);$("nearPedal").setAttribute("transform",`translate(${pedal.x} ${pedal.y}) rotate(${deg})`);$("farPedal").setAttribute("transform",`translate(${pedal.x} ${pedal.y}) rotate(${deg+180})`);lane.setAttribute("transform",`translate(${-d%200} 0)`);clouds.setAttribute("transform",`translate(${-d*.07%1000} 0)`);waves.setAttribute("transform",`translate(${-d*.14%55} 0)`);$("pelican").setAttribute("transform",`translate(0 ${bob})`);wing.setAttribute("transform",`rotate(${Math.sin(a*2)*5} 530 280)`);for(const z of legs){let t=a+z.p,f={x:pedal.x+Math.cos(t)*pedal.r,y:pedal.y+Math.sin(t)*pedal.r},h={x:z.h.x,y:z.h.y+bob},k=knee(h,f,z.u,z.l);seg(z.k+"Thigh",h,k);seg(z.k+"Shin",k,f);$(z.k+"Knee").setAttribute("cx",k.x);$(z.k+"Knee").setAttribute("cy",k.y)}}
function tick(now){let dt=Math.min(.04,(now-last)/1000);last=now;if(running){let p=Number(speed.value);a+=dt*p*2.9;d+=dt*p*190;draw()}requestAnimationFrame(tick)}
play.onclick=()=>{running=!running;play.textContent=running?"Pause ride":"Resume ride";play.setAttribute("aria-pressed",!running);status.textContent=running?"Rolling with the tide":"Resting by the sea";last=performance.now()};play.textContent=running?"Pause ride":"Resume ride";play.setAttribute("aria-pressed",!running);status.textContent=running?"Rolling with the tide":"Resting by the sea";draw();requestAnimationFrame(tick);
</script></body></html>
